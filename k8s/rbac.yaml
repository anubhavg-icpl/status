# Minimal ClusterRole for status-page k8s_* probes.
# Cluster-scope read on: nodes, pods, deployments, statefulsets, daemonsets,
# events, PVCs, HPAs, CronJobs, plus non-resource URLs (/livez, /readyz).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: status-page-reader
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - namespaces
      - events
      - persistentvolumeclaims
      - persistentvolumes
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get] # narrow: read referenced auth secrets only on demand
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources: [nodes, pods]
    verbs: [get, list]
  - nonResourceURLs:
      - /livez
      - /readyz
      - /healthz
      - /livez/*
      - /readyz/*
      - /healthz/*
      - /version
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: status-page-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: status-page-reader
subjects:
  - kind: ServiceAccount
    name: status
    namespace: invinsense
