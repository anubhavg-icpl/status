# Minimal ClusterRole for the status page.
#
# Every rule below backs a call the binary actually makes: the informer factory
# in k8sclient/client.go (nodes, pods, services, namespaces, events, PVCs,
# deployments, statefulsets, daemonsets, HPAs, cronjobs), the metrics-server
# read in cluster.go, the on-demand secret read for annotation-based probe auth
# in discovery.go, and the apiserver health/version endpoints in monitor/k8s.go.
# Read-only throughout — nothing here can mutate cluster state.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: status-page-reader
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - namespaces
      - events
      - persistentvolumeclaims
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get] # narrow: read referenced auth secrets only on demand
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [cronjobs]
    verbs: [get, list, watch]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources: [nodes]
    verbs: [get, list]
  - nonResourceURLs:
      - /livez
      - /readyz
      - /healthz
      - /livez/*
      - /readyz/*
      - /healthz/*
      - /version
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: status-page-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: status-page-reader
subjects:
  - kind: ServiceAccount
    name: status
    namespace: invinsense
