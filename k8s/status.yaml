# Status page raw k8s manifest for invinsense namespace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status
  labels:
    app: status
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: status
  template:
    metadata:
      labels:
        app: status
    spec:
      serviceAccountName: status
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: status
          image: harbor.invinsense.dev/infra/status:3740dfc-prom
          imagePullPolicy: IfNotPresent
          args: ["-config", "/config.yaml"]
          env:
            # Alert-channel secrets stay out of the ConfigMap. Env always wins
            # over config.yaml, so this is the one place to rotate them.
            # optional: true keeps the pod schedulable before the secret exists.
            - name: STATUS_NTFY_ENABLED
              value: "true"
            - name: STATUS_NTFY_SERVER
              value: "http://ntfy.invinsense.svc.cluster.local"
            - name: STATUS_NTFY_TOPIC
              valueFrom:
                secretKeyRef:
                  name: status-alerts
                  key: ntfy-topic
                  optional: true
            - name: STATUS_NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: status-alerts
                  key: ntfy-token
                  optional: true
            # VAPID keys for Web Push. Omit both and the pod generates a pair on
            # first boot and persists it to /data — fine for a single replica.
            - name: STATUS_VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: status-alerts
                  key: vapid-public-key
                  optional: true
            - name: STATUS_VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: status-alerts
                  key: vapid-private-key
                  optional: true
            - name: STATUS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: status-alerts
                  key: api-key
                  optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config-volume
              mountPath: /config.yaml
              subPath: config.yaml
            - name: data-volume
              mountPath: /data
      volumes:
        - name: config-volume
          configMap:
            name: status-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: status-data-pvc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: status
  labels:
    app: status
---
apiVersion: v1
kind: Service
metadata:
  name: status
  labels:
    app: status
spec:
  type: ClusterIP
  selector:
    app: status
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
# Alert-channel credentials. Create with real values before deploying:
#
#   kubectl -n invinsense create secret generic status-alerts \
#     --from-literal=ntfy-topic="invinsense-alerts" \
#     --from-literal=ntfy-token="tk_..." \
#     --from-literal=api-key="$(openssl rand -hex 24)"
#
# VAPID keys are optional — leave them out and the pod mints a pair on first
# boot. Supply them only when you need the same key across a rebuild, since
# changing the public key invalidates every existing browser subscription.
apiVersion: v1
kind: Secret
metadata:
  name: status-alerts
  labels:
    app: status
type: Opaque
stringData:
  ntfy-topic: "invinsense-alerts"
  ntfy-token: ""
  vapid-public-key: ""
  vapid-private-key: ""
  api-key: ""
