    annotations: {}
    enabled: false
    labels: {}
    provider: {}
    rules: []
  destinationRule:
    annotations: {}
    enabled: false
    labels: {}
    subsets: []
    trafficPolicy: {}
  enable: false
  gateway:
    annotations: {}
    enabled: false
    host: example.com
    labels: {}
    tls:
      enabled: false
