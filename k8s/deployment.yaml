ContainerPort:
  - envoyPort: 8799
    idleTimeout: 1800s
    name: app
    port: 8080
    protocol: TCP
    servicePort: 80
    supportStreaming: false
    useHTTP2: false
EnvVariables:
  # Non-secret alert settings. Env always wins over config.yaml, so this is the
  # single place to flip alerting per environment without rebuilding the image.
  - name: STATUS_ALERTS_ENABLED
    value: "true"
  - name: STATUS_CLUSTER_ENABLED
    value: "true"
  - name: STATUS_CLUSTER_ALERTS_ENABLED
    value: "true"
  - name: STATUS_CLUSTER_MIN_SEVERITY
    value: "major"
  - name: STATUS_PUSH_ENABLED
    value: "true"
  - name: STATUS_NTFY_ENABLED
    value: "true"
  - name: STATUS_NTFY_SERVER
    value: "http://ntfy.invinsense.svc.cluster.local"
# Credentials come from the existing `status-alerts` Secret (see k8s/status.yaml)
# rather than being baked into these values. Keys consumed:
#   ntfy-topic, ntfy-token, vapid-public-key, vapid-private-key, api-key
# Devtron maps them to env vars of the same UPPER_SNAKE names via the secret's
# own keys, so create it with the STATUS_* names when using this path:
#   kubectl -n invinsense create secret generic status-alerts-env \
#     --from-literal=STATUS_NTFY_TOPIC=invinsense-alerts \
#     --from-literal=STATUS_NTFY_TOKEN=tk_... \
#     --from-literal=STATUS_API_KEY="$(openssl rand -hex 24)"
ConfigSecrets:
  enabled: true
  secrets:
    - name: status-alerts-env
      type: environment
      external: true
      externalType: KubernetesSecret
GracePeriod: 30
LivenessProbe:
  Path: /healthz
  command: []
  failureThreshold: 3
  grpc: {}
  httpHeaders: []
  initialDelaySeconds: 20
  periodSeconds: 10
  port: 8080
  scheme: HTTP
  successThreshold: 1
  tcp: false
  timeoutSeconds: 5
# Surge 0 / unavailable 1: the data PVC is ReadWriteOnce, so a surge pod could
# never attach the volume and the rollout would hang. The old pod must go first.
MaxSurge: 0
MaxUnavailable: 1
MinReadySeconds: 60
ReadinessProbe:
  Path: /healthz
  command: []
  failureThreshold: 3
  grpc: {}
  httpHeaders: []
  initialDelaySeconds: 20
  periodSeconds: 10
  port: 8080
  scheme: HTTP
  successThreshold: 1
  tcp: false
  timeoutSeconds: 5
Spec:
  Affinity:
    Key: ""
    Values: ""
StartupProbe:
  Path: /healthz
  command: []
  failureThreshold: 10
  grpc: {}
  httpHeaders: []
  initialDelaySeconds: 5
  periodSeconds: 5
  port: 8080
  successThreshold: 1
  tcp: false
  timeoutSeconds: 5
affinity:
  enabled: true
  values:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - status
            topologyKey: kubernetes.io/hostname
ambassadorMapping:
  ambassadorId: ""
  cors: {}
  enabled: false
  hostname: devtron.example.com
  labels: {}
  prefix: /
  retryPolicy: {}
  rewrite: ""
  tls:
    context: ""
    create: false
    hosts: []
    secretName: ""
args:
  enabled: false
  value:
    - /bin/sh
    - -c
    - touch /tmp/healthy; sleep 30; rm -rf /tmp/healthy; sleep 600
# Scaling is off by design. State lives in BoltDB at /data/status.db on a
# ReadWriteOnce PVC, and bolt takes an exclusive flock — a second replica fails
# to open the database and the pod crashes on boot. That database holds the
# check history, incidents, VAPID keys and every push subscription.
# To run more than one replica you would need to move that state out first.
autoscaling:
  MaxReplicas: 1
  MinReplicas: 1
  TargetCPUUtilizationPercentage: 70
  TargetMemoryUtilizationPercentage: 70
  annotations: {}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
  containerResource:
    TargetCPUUtilizationPercentage: 70
    TargetMemoryUtilizationPercentage: 70
    enabled: false
  enabled: false
  extraMetrics: []
  labels: {}
command:
  enabled: false
  value: []
  workingDir: {}
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL
containerSpec:
  lifecycle:
    enabled: false
    postStart:
      httpGet:
        host: example.com
        path: /example
        port: 90
    preStop:
      exec:
        command:
          - sleep
          - "10"
containers: []
dbMigrationConfig:
  enabled: false
deploymentAnnotations: {}
deploymentLabels: {}
envoyproxy:
  configMapName: ""
  image: quay.io/devtron/envoy:v1.16.0
  lifecycle: {}
  resources:
    limits:
      cpu: 50m
      memory: 50Mi
    requests:
      cpu: 50m
      memory: 50Mi
