  requestAuthentication:
    annotations: {}
    enabled: false
    jwtRules: []
    labels: {}
    selector:
      enabled: false
  virtualService:
    annotations: {}
    enabled: false
    gateways: []
    hosts: []
    http: []
    labels: {}
kedaAutoscaling:
  advanced: {}
  authenticationRef: {}
  enabled: false
  envSourceContainerName: ""
  maxReplicaCount: 2
  minReplicaCount: 1
  triggerAuthentication:
    enabled: false
    name: ""
    spec: {}
  triggers: []
networkPolicy:
  annotations: {}
  egress: []
  enabled: false
  ingress: []
  labels: {}
  podSelector:
    matchExpressions: []
    matchLabels: {}
  policyTypes: []
pauseForSecondsBeforeSwitchActive: 30
podAnnotations: {}
# minAvailable on a single-replica Deployment would block every node drain.
# maxUnavailable 1 lets the node cordon proceed; the pod reschedules with its PVC.
podDisruptionBudget:
  maxUnavailable: 1
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
prometheus:
  release: monitoring
rawYaml: []
# Exactly one: see the autoscaling note above.
replicaCount: 1
resources:
  limits:
    cpu: "0.5"
    memory: 128Mi
  requests:
    cpu: "0.05"
    memory: 64Mi
restartPolicy: Always
secret:
  data: {}
  enabled: false
server:
  deployment:
    image: ""
    image_tag: 1-95af053
service:
  annotations: {}
  loadBalancerSourceRanges: []
  type: ClusterIP
serviceAccount:
  annotations: {}
  create: true
  name: "status"
servicemonitor:
  additionalLabels: {}
tolerations: []
topologySpreadConstraints: []
verticalPodScaling:
