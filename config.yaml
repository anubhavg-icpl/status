# =============================================================================
# Status Page - Invinsense Cluster Health Monitoring
# Multi-namespace: invinsense + ingress + cert-manager + envoy-gateway + cnpg
# =============================================================================

title: "Invinsense Cluster Status"
description: "Real-time health monitoring across the cluster"
base_url: "http://localhost:8080"

theme:
  primary_color: "#3B82F6"
  accent_color: "#10B981"
  dark_mode: true

server:
  port: 8080
  read_timeout: 15s
  write_timeout: 15s

storage:
  data_dir: "/data"

api:
  enabled: true
  key: "your-secret-api-key-here"
  rate_limit: 100

redis:
  enabled: false
  addr: "invinsense-uec-redis.invinsense.svc.cluster.local:6379"
  password: "RedisCluster@2026!"
  db: 0

webhooks: []

services:

  # ============================ Invinsense Core ============================
  - name: "Invinsense API"
    type: http
    group: "Invinsense Core"
    url: "http://invinsense-api.invinsense.svc.cluster.local/health"
    method: GET
    interval: 30s
    timeout: 10s
    expected_status: 200
    description: "Invinsense REST API (/health)"

  - name: "Invinsense Web"
    type: http
    group: "Invinsense Core"
    url: "http://invinsense-web.invinsense.svc.cluster.local:3000/"
    method: GET
    interval: 30s
    timeout: 10s
    description: "Invinsense web UI"

  - name: "DAM Server"
    type: http
    group: "Invinsense Core"
    url: "http://dam-server.invinsense.svc.cluster.local/"
    method: GET
    interval: 30s
    timeout: 10s
    description: "DAM server"

  - name: "Status (self)"
    type: http
    group: "Invinsense Core"
    url: "http://status.invinsense.svc.cluster.local/healthz"
    method: GET
    interval: 60s
    timeout: 5s
    expected_status: 200
    description: "Status page self-check"

  # ============================ Observability ==============================
  - name: "OTel Collector (Health)"
    type: http
    group: "Observability"
    url: "http://invinsense-otel-collector.invinsense.svc.cluster.local:13133/"
    method: GET
    interval: 30s
    timeout: 10s
    description: "OpenTelemetry collector health endpoint"

  - name: "OTel Collector (OTLP gRPC)"
    type: tcp
    group: "Observability"
    host: "invinsense-otel-collector.invinsense.svc.cluster.local"
    port: 4317
    interval: 30s
    timeout: 5s
    description: "OTLP gRPC ingest"

  - name: "OTel Collector (OTLP HTTP)"
    type: tcp
    group: "Observability"
    host: "invinsense-otel-collector.invinsense.svc.cluster.local"
    port: 4318
    interval: 30s
    timeout: 5s
    description: "OTLP HTTP ingest"

  - name: "Clickstack"
    type: http
    group: "Observability"
    url: "http://invinsense-clickstack.invinsense.svc.cluster.local:8080/"
    method: GET
    interval: 30s
    timeout: 10s
    description: "Clickstack frontend"

  - name: "Clickstack OpAMP"
    type: tcp
    group: "Observability"
    host: "invinsense-clickstack.invinsense.svc.cluster.local"
    port: 4320
    interval: 60s
    timeout: 5s
    description: "Clickstack OpAMP port"

  - name: "ClickHouse HTTP"
    type: http
    group: "Observability"
    url: "http://invinsense-clickhouse.invinsense.svc.cluster.local:8123/"
    method: GET
    interval: 30s
    timeout: 10s
    expected_status: 200
    description: "ClickHouse HTTP interface"

  - name: "ClickHouse Native"
    type: tcp
    group: "Observability"
    host: "invinsense-clickhouse.invinsense.svc.cluster.local"
    port: 9000
    interval: 30s
    timeout: 5s
    description: "ClickHouse native TCP"

  # =============================== Databases ===============================
  - name: "MongoDB"
    type: mongodb
    group: "Databases"
    host: "invinsense-mongo.invinsense.svc.cluster.local"
    port: 27017
    interval: 30s
    timeout: 5s
    description: "Invinsense MongoDB"

  - name: "PostgreSQL (pgpool)"
    type: postgres
    group: "Databases"
    host: "invinsense-postgresqlha-pgpool.invinsense.svc.cluster.local"
    port: 5432
    interval: 30s
    timeout: 5s
    description: "Postgres HA pgpool"

  - name: "PostgreSQL (primary)"
    type: postgres
    group: "Databases"
    host: "invinsense-postgresqlha-postgresql.invinsense.svc.cluster.local"
    port: 5432
    interval: 30s
    timeout: 5s
    description: "Postgres HA primary"

  - name: "Redis (UEC)"
    type: redis
    group: "Databases"
    host: "invinsense-uec-redis.invinsense.svc.cluster.local"
    port: 6379
    password: "RedisCluster@2026!"
    interval: 30s
    timeout: 5s
    description: "Invinsense UEC Redis (auth)"

  # =============================== Messaging ===============================
  - name: "NATS (Client)"
    type: tcp
    group: "Messaging"
    host: "invinsense-nats.invinsense.svc.cluster.local"
    port: 4222
    interval: 30s
    timeout: 5s
    description: "NATS client port"

  - name: "NATS (Monitoring)"
    type: http
    group: "Messaging"
    url: "http://invinsense-nats.invinsense.svc.cluster.local:8222/healthz"
    method: GET
    interval: 30s
    timeout: 10s
    expected_status: 200
    description: "NATS monitoring/health"

  - name: "NATS (Cluster)"
    type: tcp
    group: "Messaging"
    host: "invinsense-nats.invinsense.svc.cluster.local"
    port: 6222
    interval: 60s
    timeout: 5s
    description: "NATS cluster routes"

  # ============================ Object Storage =============================
  - name: "RustFS API"
    type: tcp
    group: "Storage"
    host: "invinsense-uec-rustfs.invinsense.svc.cluster.local"
    port: 9000
    interval: 30s
    timeout: 5s
    description: "RustFS S3-compatible API"

  - name: "RustFS Console"
    type: http
    group: "Storage"
    url: "http://invinsense-uec-rustfs.invinsense.svc.cluster.local:9001/health"
    method: GET
    interval: 60s
    timeout: 10s
    expected_status: 200
    description: "RustFS console /health"

  # ================================ Harbor =================================
  - name: "Harbor (LB)"
    type: http
    group: "Harbor"
    url: "http://harbor.invinsense.svc.cluster.local/"
    method: GET
    interval: 30s
    timeout: 10s
    description: "Harbor frontend (nginx)"

  - name: "Harbor Portal"
    type: http
    group: "Harbor"
    url: "http://harbor-portal.invinsense.svc.cluster.local/"
    method: GET
    interval: 30s
    timeout: 10s
    description: "Harbor UI portal"

  - name: "Harbor Core API"
    type: http
    group: "Harbor"
    url: "http://harbor-core.invinsense.svc.cluster.local/api/v2.0/ping"
    method: GET
    interval: 30s
    timeout: 10s
    expected_status: 200
    description: "Harbor core API ping"

  - name: "Harbor Registry v2"
    type: http
    group: "Harbor"
    url: "http://harbor-registry.invinsense.svc.cluster.local:5000/v2/"
    method: GET
    interval: 30s
    timeout: 10s
    expected_status: 401
    description: "Registry /v2/ (401 = healthy, auth required)"

  - name: "Harbor JobService"
    type: tcp
    group: "Harbor"
    host: "harbor-jobservice.invinsense.svc.cluster.local"
    port: 80
    interval: 30s
    timeout: 5s
    description: "Harbor jobservice"

  - name: "Harbor Trivy"
    type: tcp
    group: "Harbor"
    host: "harbor-trivy.invinsense.svc.cluster.local"
    port: 8080
    interval: 60s
    timeout: 5s
    description: "Harbor Trivy scanner"

  - name: "Harbor Exporter"
    type: tcp
    group: "Harbor"
    host: "harbor-exporter.invinsense.svc.cluster.local"
    port: 8001
    interval: 60s
    timeout: 5s
    description: "Harbor metrics exporter"

  - name: "Harbor Database"
    type: postgres
    group: "Harbor"
    host: "harbor-database.invinsense.svc.cluster.local"
    port: 5432
    interval: 60s
    timeout: 5s
    description: "Harbor Postgres backend"

  - name: "Harbor Redis"
    type: tcp
    group: "Harbor"
    host: "harbor-redis.invinsense.svc.cluster.local"
    port: 6379
    interval: 60s
    timeout: 5s
    description: "Harbor Redis backend (TCP probe)"

  # ============================ Cluster Ingress ============================
  - name: "Ingress NGINX (HTTP)"
    type: http
    group: "Cluster Ingress"
    url: "http://ingress-nginx-controller.ingress-nginx.svc.cluster.local/"
    method: GET
    interval: 30s
    timeout: 10s
    expected_status: 404
    description: "ingress-nginx LB (404 default backend = healthy)"

  - name: "Ingress NGINX (HTTPS)"
    type: tcp
    group: "Cluster Ingress"
    host: "ingress-nginx-controller.ingress-nginx.svc.cluster.local"
    port: 443
    interval: 30s
    timeout: 5s
    description: "ingress-nginx HTTPS listener (TCP probe — cert is for external host)"

  - name: "Envoy Gateway (admin)"
    type: tcp
    group: "Cluster Ingress"
    host: "envoy-gateway.envoy-gateway-system.svc.cluster.local"
    port: 19001
    interval: 60s
    timeout: 5s
    description: "Envoy Gateway admin port"

  - name: "Envoy UEC Gateway (LB)"
    type: http
    group: "Cluster Ingress"
    url: "http://envoy-invinsense-invinsense-uec-gateway-022f0115.envoy-gateway-system.svc.cluster.local/"
    method: GET
    interval: 30s
    timeout: 10s
    expected_status: 404
    description: "Envoy LB for UEC gateway"

  # ============================ Control Plane ==============================
  - name: "Cert-Manager (metrics)"
    type: tcp
    group: "Control Plane"
    host: "cert-manager.cert-manager.svc.cluster.local"
    port: 9402
    interval: 60s
    timeout: 5s
    description: "cert-manager metrics"

  - name: "Cert-Manager Webhook"
    type: tcp
    group: "Control Plane"
    host: "cert-manager-webhook.cert-manager.svc.cluster.local"
    port: 443
    interval: 60s
    timeout: 5s
    description: "cert-manager webhook"

  - name: "CNPG Webhook"
    type: tcp
    group: "Control Plane"
    host: "cnpg-webhook-service.cnpg-system.svc.cluster.local"
    port: 443
    interval: 60s
    timeout: 5s
    description: "CloudNativePG webhook"

  - name: "MetalLB Webhook"
    type: tcp
    group: "Control Plane"
    host: "metallb-webhook-service.metallb-system.svc.cluster.local"
    port: 443
    interval: 60s
    timeout: 5s
    description: "MetalLB webhook"

  # ================================ Security ===============================
  - name: "Harbor TLS (public)"
    type: tls
    group: "Security"
    host: "harbor.invinsense.dev"
    port: 443
    interval: 1h
    timeout: 10s
    tls_warn_days: 30
    description: "harbor.invinsense.dev cert expiry"

  # =========================== Kubernetes Cluster ==========================
  - name: "API Server (/livez)"
    type: k8s_apiserver
    group: "Kubernetes"
    k8s_path: "/livez"
    interval: 30s
    timeout: 10s
    description: "kube-apiserver liveness"

  - name: "API Server (/readyz)"
    type: k8s_apiserver
    group: "Kubernetes"
    k8s_path: "/readyz"
    interval: 30s
    timeout: 10s
    description: "kube-apiserver readiness (incl. etcd)"

  - name: "API Server Latency"
    type: k8s_api_latency
    group: "Kubernetes"
    interval: 30s
    timeout: 10s
    description: "LIST /namespaces?limit=1 round-trip"

  - name: "Cluster Nodes"
    type: k8s_nodes
    group: "Kubernetes"
    k8s_ready_pct: 90
    interval: 30s
    description: "Aggregate node Ready / pressure status"

  - name: "Cluster Warning Events"
    type: k8s_events
    group: "Kubernetes"
    k8s_warn_per_min: 2
    interval: 60s
    description: "Warning events last 15m, all namespaces"

  - name: "CrashLoop Pods (invinsense)"
    type: k8s_pods_crash
    group: "Kubernetes"
    k8s_namespace: "invinsense"
    k8s_crash_thresh: 1
    interval: 60s
    description: "Pods stuck in CrashLoopBackOff / ImagePullBackOff"

  - name: "PVCs (invinsense)"
    type: k8s_pvc
    group: "Kubernetes"
    k8s_namespace: "invinsense"
    interval: 60s
    description: "PVC bound state"

  # --- Workload health (key deployments) ---
  - name: "Workload: invinsense-api"
    type: k8s_deployment
    group: "Kubernetes Workloads"
    k8s_namespace: "invinsense"
    k8s_name: "invinsense-api"
    interval: 30s
    description: "Deployment readyReplicas vs spec"

  - name: "Workload: invinsense-web"
    type: k8s_deployment
    group: "Kubernetes Workloads"
    k8s_namespace: "invinsense"
    k8s_name: "invinsense-web"
    interval: 30s
    description: "Deployment readyReplicas vs spec"

  - name: "Workload: invinsense-clickstack"
    type: k8s_deployment
    group: "Kubernetes Workloads"
    k8s_namespace: "invinsense"
    k8s_name: "invinsense-clickstack"
    interval: 30s
    description: "Deployment readyReplicas vs spec"

  - name: "Workload: invinsense-otel-collector"
    type: k8s_deployment
    group: "Kubernetes Workloads"
    k8s_namespace: "invinsense"
    k8s_name: "invinsense-otel-collector"
    interval: 30s
    description: "Deployment readyReplicas vs spec"

  - name: "Workload: invinsense-postgresqlha-pgpool"
    type: k8s_deployment
    group: "Kubernetes Workloads"
    k8s_namespace: "invinsense"
    k8s_name: "invinsense-postgresqlha-pgpool"
    interval: 30s
    description: "Deployment readyReplicas vs spec"

  - name: "Workload: harbor-core"
    type: k8s_deployment
    group: "Kubernetes Workloads"
    k8s_namespace: "invinsense"
    k8s_name: "harbor-core"
    interval: 30s
    description: "Deployment readyReplicas vs spec"

  - name: "Workload: status (self)"
    type: k8s_deployment
    group: "Kubernetes Workloads"
    k8s_namespace: "invinsense"
    k8s_name: "status"
    interval: 60s
    description: "Self deployment health"

  # --- StatefulSets ---
  - name: "STS: invinsense-mongo"
    type: k8s_statefulset
    group: "Kubernetes Workloads"
    k8s_namespace: "invinsense"
    k8s_name: "invinsense-mongo"
    interval: 30s
    description: "MongoDB StatefulSet"

  - name: "STS: invinsense-nats"
    type: k8s_statefulset
    group: "Kubernetes Workloads"
    k8s_namespace: "invinsense"
    k8s_name: "invinsense-nats"
    interval: 30s
    description: "NATS StatefulSet"

  - name: "STS: invinsense-uec-redis"
    type: k8s_statefulset
    group: "Kubernetes Workloads"
    k8s_namespace: "invinsense"
    k8s_name: "invinsense-uec-redis"
    interval: 30s
    description: "Redis cluster StatefulSet"

  - name: "STS: invinsense-postgresqlha-postgresql"
    type: k8s_statefulset
    group: "Kubernetes Workloads"
    k8s_namespace: "invinsense"
    k8s_name: "invinsense-postgresqlha-postgresql"
    interval: 30s
    description: "PostgreSQL HA StatefulSet"

  - name: "STS: invinsense-clickhouse"
    type: k8s_statefulset
    group: "Kubernetes Workloads"
    k8s_namespace: "invinsense"
    k8s_name: "invinsense-clickhouse"
    interval: 30s
    description: "ClickHouse StatefulSet"
